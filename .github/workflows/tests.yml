name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # head_ref is the PR's branch, ref_name the pushed one: a push and the pull_request run it triggers share a group, so one cancels the other
  group: tests-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Extras (tk, web, dsp, test) come from pyproject.toml. dsp needs rpps >= 0.5.0 from PyPI
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tk,web,dsp,test]"

      # The browser tests (tests/test_web_*.py) drive a real chromium through playwright
      - name: Install chromium for playwright
        run: python -m playwright install --with-deps chromium

      # test_tk needs a display: xvfb on Linux, Windows has one
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python -m pytest -q --durations=10

      - name: Run tests (Windows)
        if: runner.os != 'Linux'
        run: python -m pytest -q --durations=10

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests dev tools examples # the rules are in pyproject.toml

  without-rpps:
    # rpps is optional: everything but the DSP plots must work without it (they skip, the rest runs)
    name: Without rpps (Python 3.12, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYSPECAN_NO_RPPS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package (no dsp extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tk,web,test]"
          python -m playwright install --with-deps chromium
      - name: Run tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python -m pytest -q --durations=10

  package:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build twine
      - name: Build sdist, then the wheel from the sdist
        run: python -m build
      - run: python -m twine check dist/*
      - name: Wheel carries the web assets
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert any("/static/" in n for n in names), "static/ missing from the wheel"
          assert any("/templates/" in n for n in names), "templates/ missing from the wheel"
          PY
      - name: Install into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "import pyspecan"

  docs:
    # Same build as deploy-docs (strict), so a broken docstring cross-reference or snippet path fails the pull request
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - run: python tools/builder.py -d
      - run: test -f site/api/plots/index.html && test -s site/llms-full.txt
