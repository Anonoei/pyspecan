<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pyspecan</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="pyspecan">
    <div class="toolbar">
        <h3>pyspecan</h3>
        <div id="connection-status" class="status disconnected" title="disconnected"></div>
        <button id="btn-start">Start</button>
        <button id="btn-stop">Stop</button>
        <button id="btn-reset">Reset</button>
        <span class="file-only">
            <button id="btn-prev" title="previous block">&lt;</button>
            <button id="btn-next" title="next block">&gt;</button>
            <input type="range" id="sld-samp" min="0" max="1" value="0">
            <span id="lbl-time" class="muted"></span>
        </span>
        <span id="lbl-message" class="warning"></span>
        <span class="right">
            <select id="sel-plot-type" title="plot type to add"></select>
            <button id="btn-add-plot">Add plot</button>
        </span>
    </div>

    <div class="body">
        <div class="controls">
            <h3>Controls</h3>
            <div class="control-group file-only"><label>File</label><button id="btn-open">Open…</button></div>
            <div class="path muted file-only" id="lbl-path"></div>
            <div class="control-group file-only"><label for="sel-fmt">Format</label><select id="sel-fmt" data-set="fmt"></select></div>
            <div class="control-group"><label for="in-fs">Sample rate</label><input id="in-fs" data-set="fs"></div>
            <div class="control-group"><label for="in-cf">Center freq</label><input id="in-cf" data-set="cf"></div>
            <div class="control-group"><label for="in-nfft">FFT size (2^n)</label><input id="in-nfft" type="number" min="2" max="20" step="1" data-set="nfft_exp"></div>
            <div class="control-group"><span class="muted">Block size (samples)</span><span id="lbl-block"></span></div>
            <div class="control-group"><label for="in-sweep">Sweep time (ms)</label><input id="in-sweep" type="number" min="0" step="10" data-set="sweep"></div>
            <div class="control-group"><label for="in-overlap">RT overlap</label><input id="in-overlap" type="number" min="0" max="0.99" step="0.05" data-set="overlap"></div>
            <div class="control-group"><label for="in-show">Show time (ms)</label><input id="in-show" type="number" min="0" step="10" data-set="show"></div>
        </div>
        <div class="panels" id="panels"></div>
    </div>
</div>

<dialog id="dlg-file">
    <form method="dialog" id="frm-file">
        <h3>Open file</h3>
        <div class="control-group"><input id="in-dir" spellcheck="false"><button type="button" id="btn-dir-go">Go</button></div>
        <div id="lbl-dir-error" class="danger"></div>
        <ul id="lst-files"></ul>
        <div class="dlg-actions"><button value="cancel">Cancel</button></div>
    </form>
</dialog>
<script src="/static/app.js"></script>
</body>
</html>
