[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspecan"
version = "0.7.0"
description = "A spectrum analyzer library"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Anonoei", email="to+dev@an0.us"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",

    "Topic :: Scientific/Engineering",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",

    "Operating System :: OS Independent",
]
keywords = ["anonoei", "sdr", "speca", "specan"]
dependencies = ["numpy>=2.0", "pysdrlib>=0.5.0"]

[project.optional-dependencies]
tk = ["matplotlib"]
web = ["fastapi", "uvicorn", "jinja2", "websockets"]
dsp = ["rpps>=0.6.0"] # the DSP plots: signal search, analog demod, constellation and quality, channel, decode (pyspecan.plots.dsp)
test = ["pytest", "httpx", "pysdrlib[remote]", "playwright"]
docs = ["zensical>=0.1.3", "mkdocstrings-python>=2.0"]
dev = ["pyspecan[tk,web,dsp,test,docs]", "twine", "build", "bumpver"]

[project.scripts]
pyspecan-cui = "pyspecan._internal.main:main_cui"

[project.gui-scripts]
pyspecan = "pyspecan._internal.main:main"

[project.urls]
Homepage = "https://github.com/anonoei/pyspecan"
Documentation = "https://anonoei.github.io/pyspecan/"
Repository = "https://github.com/Anonoei/pyspecan.git"
Issues = "https://github.com/Anonoei/pyspecan/issues"
Source = "https://github.com/anonoei/pyspecan"

[tool.setuptools.package-data]
"pyspecan.view.WEB" = ["static/*", "templates/*"]

[tool.ruff]
line-length = 140
src = ["src", "tests", "tools", "examples"]

[tool.ruff.lint]
# syntax and runtime errors (E4, E7, E9), pyflakes (F), import order (I): the classic set, the rest is style
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E701", "E702", "E731", "E741"] # one line ifs, a; b, small lambdas and `l` are the house style

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # re-exports
"tools/*.py" = ["E402"]  # sys.path set up before the imports
"tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pyspecan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.bumpver]
current_version = "0.7.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]
"src/pyspecan/__init__.py" = ["{version}"]
